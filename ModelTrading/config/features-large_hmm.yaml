  - {name: m15_hour_sin, role: model, enabled: true, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY [-1,1] intraday seasonality
  - {name: m15_hour_cos, role: model, enabled: true, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY [-1,1]

  # --- scheduled central-bank calendar (timestamp-derived — features/calendar_events.py) ---
  # Calendar days until the next scheduled rate decision: 0 = today, 1 = tomorrow.
  # Source: data/fxstreet_calendar_event_list.csv (coverage 2007-08..2026-12; NaN
  # outside coverage rather than a fabricated countdown). FED event name:
  # "Fed Interest Rate Decision". EZB: "ECB Main Refinancing Operations Rate" —
  # NOT "ECB Press Conference", that is the presser 45 min after the decision and
  # does not exist for every meeting (133 vs 186 entries).
  # NO shift(1): the meeting calendar is published over a year in advance, so the
  # bar's own date is legitimately usable; a shift would make the countdown wrong
  # by one day. Deliberately M15-level, NOT daily_: daily rows reach M15 bars only
  # after the +24h close-time shift, so a daily_ countdown would read 1 on the
  # decision day and 0 the day AFTER — the m15 variant is exact intraday.
  # If enabled, calendar_events.py + the fxstreet CSV become live runtime
  # artefacts (stage_jforex.ps1 allowlists must include both).
  - {name: m15_until_fed_ir_decision, role: model, enabled: true, models: [long_slow, short_slow, long_fast, short_fast]}  # STATIONARY sawtooth 0..~56
  - {name: m15_until_ezb_ir_decision, role: model, enabled: true, models: [long_slow, short_slow, long_fast, short_fast]}  # STATIONARY sawtooth 0..~56  

