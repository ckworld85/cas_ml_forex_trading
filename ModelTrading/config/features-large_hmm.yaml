  - {name: m15_momentum_consistency_5, role: model, enabled: true, models: [long_fast, short_fast]}                # STATIONARY [0,1]

  # --- tick volume (TRAINING ONLY: the live payload from Java carries no volume) ---
  # Dukascopy ships tick volume (price updates/bar), not traded volume. Its level
  # drifts ~9x across 2005-2026 with the feed, so only relative measures are used —
  # never raw levels or cumulative sums (OBV/AccDist are non-stationary here).
  # Windows stay <= 1 week so normalisation never spans a feed change.
  # Measured max |corr| against the existing m15 feature set (150k bars) is noted
  # per line — the three orthogonal ones are the reason to try volume at all.
  - {name: m15_volume_percentile_96, role: model, enabled: false, models: [long_fast, short_fast]}       # STATIONARY [0,100] relative activity | corr 0.21 ORTHOGONAL
  - {name: m15_effort_result_96, role: model, enabled: false, models: [long_fast, short_fast]}           # STATIONARY log(vol_ratio)-log(range/atr): absorption vs frictionless | corr 0.18 ORTHOGONAL
  - {name: m15_vol_price_divergence_96, role: model, enabled: false, models: [long_fast, short_fast]}    # STATIONARY [-1,1] is the move backed by participation | corr 0.18 ORTHOGONAL
  # The two below largely restate features the model already has — enable only to verify.
  - {name: m15_cmf_20, role: model, enabled: false, models: [long_fast, short_fast]}                     # STATIONARY [-1,1] Chaikin Money Flow | corr 0.61 vs m15_rsi
  - {name: m15_vwap_deviation_96, role: model, enabled: false, models: [long_fast, short_fast]}          # STATIONARY signed VWAP distance in window-ATR units | corr 0.85 vs m15_macd_atr


  # --- paper-reported features (2026-08-29 candidate screen) ---
  # Seven features reported as top importance in an external paper. Added disabled; the
  # screening protocol is redundancy check -> information_audit -> only then a model arm.
  # IMPORTANCE IS NOT OOS EVIDENCE: measured the same day, rate_diff_10y_chg20_z250 took
  # 3.15% of XGBoost gain and then returned -33.4 EUR/trade over 36 walk-forward runs.
  # bb_pband from the paper already exists here as {tf}_bb_percent.
  # Raw hl_range / oc_range / log_return are NON-STATIONARY in price units (EUR/USD ran
  # 0.95-1.60 with ~3x volatility drift), so they enter ATR-normalised.
  - {name: m15_adx_pos, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [0,100] +DI, the direction ADX discards
  - {name: m15_adx_neg, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [0,100] -DI
  - {name: m15_cci, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY self-normalised by mean deviation
  - {name: m15_channel_pos_10, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [0,1] Donchian position
  - {name: m15_hl_range_atr, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY bar range / ATR
  - {name: m15_oc_range_atr, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY signed (close-open) / ATR
  - {name: m15_log_return_atr_1, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY 1-bar log return / ATR

