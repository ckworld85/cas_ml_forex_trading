  - {name: m15_volatility_percentile, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [0,100]

  # --- trend quality (continuation vs exhaustion) ---
  - {name: m15_slope_efficiency, role: model, enabled: true, models: [long_fast, short_fast]}      # STATIONARY R^2*sign over 12 bars — clean-trend continuation signal
  - {name: m15_pullback_20, role: model, enabled: false, models: [long_fast, short_fast]}           # STATIONARY ATR-norm pullback depth in trend dir (shallow = continuation entry)
  - {name: m15_momentum_accel_12, role: model, enabled: true, models: [long_fast, short_fast]}     # STATIONARY ATR-norm Δ in 12-bar return (<0 = momentum rolling over)

  # --- bar structure ---
  - {name: m15_close_vs_bar_range, role: model, enabled: true, models: [long_fast, short_fast]}    # Inconclusive ADF p 0.0000   KPSS p 0.0100   LB p 0.0000  CV 0.008
  - {name: m15_bar_body_ratio, role: model, enabled: true, models: [long_fast, short_fast]}        # Inconclusive ADF p 0.0000   KPSS p 0.0100   LB p 0.0000  CV 0.007
