# Feature Configuration - FULL SCREENING CATALOGUE for label mode `trend_only`
# =============================================================================
# NOT A TRAINING CANDIDATE. This enables (nearly) every implemented feature —
# 65 fast / 134 slow — INCLUDING the label-leak test features `m15_y`/`daily_y`
# (= long minus short label). Any model trained on it scores AUC ~0.98 by
# construction: the label is among its inputs. NEVER stage, deploy, or quote
# its metrics as model quality.
# Purpose: source matrix for feature screens. The 2026-09-06 within-TREND
# label-association screen ran on this catalogue (run `features-full-trend_only`)
# and produced the re-selected features-trend_only.yaml (at the time named
# features-pruned-trend_only.yaml). The screen method is reproducible from the
# run's X_{model}/label parquets.
#
# Feature Configuration — flat per-feature schema
# =============================================================================
# Single source of truth. Each entry under `features:` is one feature:
#
#   - name:     feature name with timeframe prefix (m15_/4hours_/daily_)
#   - role:     model  -> a model input
#               helper -> computed intermediate (not a model input)
#   - models:   which trained models this feature feeds (role: model only).
#               valid: long_fast, short_fast, long_slow, short_slow
#   - enabled:  default true. enabled: true fully deactivates the feature
#               (replaces the old `##` line-commenting); excluded from every list.
#   - external: default false. true = sourced from an external CSV, not OHLC.
#
# Training cadence is encoded in the model name: *_fast train on M15 bars,
# *_slow train on 4h-resampled bars. Each model gets its OWN selected
# feature set, scaler and ONNX input shape.
#
# STATIONARITY LEGEND (model features):
#   STATIONARY     — bounded / normalized vs own history; safe across regimes
#   PARTIAL        — normalized vs price but drifts with volatility regime
#   NON-STATIONARY — raw price units or unbounded; drifts over time
# =============================================================================

features:

  # ===========================================================================
  # M15 TIMEFRAME — feeds long_fast / short_fast
  # ===========================================================================

  # --- raw OHLC (inert: neither helper nor model input) ---
