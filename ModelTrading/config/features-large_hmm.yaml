  # Multi-timeframe trend agreement: mean(tanh(slope/scale)) over the three
  # ATR-normalised regression slopes in parameters.mtf_trend_slope_sources.
  # [-1,1]: +1 = all timeframes trending up, -1 = all down, ~0 = disagreement.
  # Requires its source trend_slope features enabled (model or helper role).
  # Screen 2026-09-02 (2014-2026, 36.6k sampled bars, 43 active features):
  # corr 0.81/0.83 (pearson/spearman) vs daily_bb_deviation — AT the 0.80
  # redundancy threshold; the sources pairwise correlate only 0.03-0.26, so the
  # aggregation is real, but the aggregate lands on information the model
  # already holds. Stays disabled per protocol (screen -> audit -> A/B).
  #
  # The three sources are REQUIRED whenever mtf_trend_agreement is enabled —
  # without them the column is all-NaN and the data alignment drops every row.
  # role: helper keeps them out of the pruned model sets: only the aggregate
  # enters the models, the raw slopes are computed but not fed to XGBoost.
  - {name: m15_trend_slope_96, role: helper}      # OLS slope over 96 bars (1 day) / ATR
  - {name: 4hours_trend_slope_30, role: helper}   # OLS slope over 30 bars (1 week) / ATR
  - {name: daily_trend_slope_20, role: helper}    # OLS slope over 20 bars (~1 month) / ATR
  - {name: mtf_trend_agreement, role: model, enabled: true, models: [long_slow, short_slow, long_fast, short_fast]}  # STATIONARY [-1,1]

