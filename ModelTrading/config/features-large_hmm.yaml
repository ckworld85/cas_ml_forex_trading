  # Added 2026-08-29. Before that the data set contained NO euro-area market rate, so the
  # variable FX theory actually points at could not be formed at all.
  #
  # STATIONARITY (measured, not assumed — see the table in external_data.get_external_df):
  #   * The raw LEVELS have a unit root (Dickey-Fuller t -1.55 / -2.01 against a -2.86
  #     critical value, AC(1) 0.999) and their mean shifts with the monetary regime:
  #     rate_diff_2y averages 0.01 in 2005-2011, 1.30 in 2012-2021, 1.90 in 2022-2026.
  #     A split at "> 1.0" means something different in 2008 than in 2024. NOT usable
  #     as model inputs -> role: helper.
  #   * The raw CHANGES are stationary in mean (DF t -18 to -38) but their volatility
  #     differs by 1.7-2.1x between the ZLB years and the hiking cycles. Also helpers.
  #   * The causal trailing z-scores (_z250) are what a model gets: DF t -1.55 -> -5.29
  #     for the level, per-era volatility ratio 3.1 -> 1.0 and 1.7 -> 1.1.
