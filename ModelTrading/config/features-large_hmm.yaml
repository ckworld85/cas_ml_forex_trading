  - {name: m15_l, role: helper, enabled: false}
  - {name: m15_c, role: helper, enabled: false}

  # LABEL-LEAK TEST ONLY (= long_slow - short_slow). Never deploy live.
  - {name: m15_y, role: model, enabled: false, models: [long_fast, short_fast]}

  # --- helpers ---
  - {name: m15_mid, role: helper}            # NON-STATIONARY: raw price level
  - {name: m15_bb_upper, role: helper}       # NON-STATIONARY
  - {name: m15_bb_middle, role: helper}      # NON-STATIONARY (SMA-20)
  - {name: m15_bb_lower, role: helper}       # NON-STATIONARY
