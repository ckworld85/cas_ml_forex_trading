  - {name: m15_tri_gbp_chg_z_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY causal z of the 4h residual change
  - {name: m15_tri_jpy_z_96, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY causal z of the JPY triangle residual log(EURUSD)-log(EURJPY)+log(USDJPY) over 1d
  - {name: m15_tri_jpy_chg_z_4_1920, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY causal z of the 1h residual change (= EUR-legs divergence via JPY)
  - {name: m15_tri_jpy_chg_z_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY causal z of the 4h residual change
  - {name: m15_eurx_z_4_1920, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY cross-only EUR strength: mean per-pair causal z of 1h EURGBP/EURJPY returns
  - {name: m15_eurx_z_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY cross-only EUR strength, 4h returns
  - {name: m15_eurx_z_32_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY cross-only EUR strength, 8h returns
  - {name: m15_usdb_4, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [-1,1] intraday USD breadth: mean sign of USD-positive 1h moves over 6 USD pairs (all 6 required)
  - {name: m15_usdb_16, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY [-1,1] intraday USD breadth, 4h moves
  - {name: m15_usdb_32, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY [-1,1] intraday USD breadth, 8h moves
  - {name: m15_usdz_4_1920, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY intraday USD strength: mean per-pair causal z of USD-positive 1h returns
  - {name: m15_usdz_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY intraday USD strength, 4h returns
  - {name: m15_usdz_32_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY intraday USD strength, 8h returns
  - {name: m15_usd_disp_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY cross-sectional std of the 6 signed z-returns (common factor vs idiosyncratic)
  - {name: m15_llpred_gbp_480, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY causal lead-lag prediction: trailing beta(EURUSD_t ~ GBPUSD_(t-1)) read 1 bar back x latest GBPUSD move
  - {name: m15_llpred_jpy_480, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY causal lead-lag prediction via USDJPY
  - {name: m15_llpred_eurx_480, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY causal lead-lag prediction via the EURGBP/EURJPY composite
  - {name: m15_corrbk_gbp_96_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY [0,100] percentile of rolling 1d corr(EURUSD, GBPUSD) vs own 20d history (breakdown flag)
  - {name: m15_corrbk_jpy_96_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY [0,100] percentile of rolling 1d corr(EURUSD, USDJPY)
  - {name: m15_rvz_gbp_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY causal z of log 4h realized vol of GBPUSD (vol spillover condition)
  - {name: m15_rvz_jpy_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY causal z of log 4h realized vol of USDJPY
  - {name: m15_xcons_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY EURUSD-aligned cross consensus (eurx_z - usdz)/2, 4h
  - {name: m15_xcons_32_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY EURUSD-aligned cross consensus, 8h
  - {name: m15_risk_z_16_1920, role: model, enabled: false, models: [long_fast, short_fast, long_slow, short_slow]}  # STATIONARY causal z of the 4h AUDJPY return (intraday risk-on/off proxy)

  # ===========================================================================
  # B6 TIMING & EXECUTION FAMILY (added 2026-09-12).
  # Timing (when to act) + execution (how to place/manage an order): vol shift,
  # spread regime, liquidity impulse, microstructure break, maker queue proxy,
  # adaptive SL/TP/trailing distances, round-trip cost floor. Bare fixed names,
  # windows in the tx_* parameters (mtf/session precedent; keys avoid the
  # warm-up regex suffixes ON PURPOSE - documented under-provisioning, leading
  # NaNs fall to the complete-case filter). NOT direction candidates: the
  # accompanying audit (analytics/timing_execution_audit.py) is regime/
  # redundancy/timing-relevance only. spread_norm/spread_regime need mid,
  # liq_impulse* needs tick volume (TRAINING-ONLY, the A9 constraint);
  # queue_good/maker_ok/cost_floor_pips degrade documentedly without them.
  # The execution members (maker_ok..cost_floor_pips) are EXECUTION-LAYER
  # quantities served via feature_server's "execution" block - never intended
  # as model inputs. ALL DISABLED. Roster: analytics/timing_execution_catalog.py.
  # ===========================================================================
  - {name: m15_vol_ratio, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY ATR(16)/ATR(96) volatility-shift level
  - {name: m15_vol_shift_signal, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY robust causal z of log(vol_ratio) (trailing median/IQR, 480 bars)
  - {name: m15_range_ratio, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY (0,1] 16-bar range / 96-bar range (compression state)
  - {name: m15_micro_break, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY signed close-break of trailing Donchian(96) / ATR, 0 inside
  - {name: m15_spread_norm, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY log(spread / trailing same-slot median) | needs mid (TRAINING-ONLY)
  - {name: m15_spread_regime, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [0,1] causal pct rank of spread_norm over 20d | needs mid
  - {name: m15_liq_impulse_score, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY volume slot-z minus spread slot-z | needs volume (TRAINING-ONLY)
  - {name: m15_liq_impulse, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [0,1] causal pct rank of liq_impulse_score over 20d | needs volume
  - {name: m15_queue_good, role: model, enabled: false, models: [long_fast, short_fast]}  # STATIONARY [0,1] maker queue proxy (calm vol + calm spread; degrades to vol-only)
  - {name: m15_maker_ok, role: model, enabled: false, models: [long_fast, short_fast]}  # EXECUTION [0,1] maker suitability = queue_good x (1 - impulse pct)
  - {name: m15_sl_pips, role: model, enabled: false, models: [long_fast, short_fast]}  # EXECUTION adaptive stop = clip(0.5 x 96-bar range pips, 15, 60)
  - {name: m15_tp_pips, role: model, enabled: false, models: [long_fast, short_fast]}  # EXECUTION adaptive target = clip(0.5 x 96-bar range pips, 15, 150)
  - {name: m15_trail_pips, role: model, enabled: false, models: [long_fast, short_fast]}  # EXECUTION vol trailing stop = clip(0.5 x 16-bar range pips, 8, 40)
  - {name: m15_cost_floor_pips, role: model, enabled: false, models: [long_fast, short_fast]}  # EXECUTION round-trip cost: trailing median spread + 2x slippage + commission

parameters:
  volatility_period: 10

  # Multi-timeframe trend agreement (mtf_trend_agreement) — combined-frame
  # column names; scale: |slope/ATR| == scale maps to tanh(1) = 0.76. Keep it
  # small: redundancy vs daily_bb_deviation rises with the scale (0.81 at 0.05
  # -> 0.89 at 0.20).
  mtf_trend_slope_sources: [m15_trend_slope_96, 4hours_trend_slope_30, daily_trend_slope_20]
  mtf_agreement_scale: 0.05

  # Moving average periods
  ma_short: 30
  ma_medium: 80
  ma_institutional: 100
  ma_long: 200

  # Slope calculation
  sma_30_slope_diff: 5
  sma_80_slope_diff: 10

  # Momentum periods
  momentum_short: 5
  momentum_medium: 10
  momentum_long: 20
  momentum_xlong: 60

  # Oscillator periods
  rsi_period: 14

  # Regime metric periods
  adx_period: 14
  adx_threshold: 25
  price_efficiency_period: 20
  price_efficiency_threshold: 0.5
  volatility_percentile_period: 14
  volatility_percentile_lookback: 500
  adx_percentile_period: 14
  adx_percentile_lookback: 500

  # TimesFM forecast parameters
  # NOTE: the forecast horizon is NOT a parameter anymore — it is encoded in each
  # tfm feature-name suffix (e.g. m15_tfm_mean_144, 4hours_tfm_mean_9, daily_tfm_mean_2).
  tfm_context_length: 512
  tfm_batch_size: 256
  tfm_freq_m15: 0                      # 0 = high-frequency intraday
  tfm_freq_4hours: 0
  tfm_freq_daily: 1                    # 1 = daily
  tfm_model_repo: "google/timesfm-2.5-200m-pytorch"

  # ML regime-model parameters (data/update_regime_model_data.py).
  # rgm_n_states must match the number of daily_rgm_prob_s* features above.
  rgm_algo: hmm                        # hmm | gmm | kmeans
  rgm_n_states: 3
  rgm_seed: 42
  rgm_obs_adx_period: 14               # observation-vector indicator periods
  rgm_obs_efficiency_period: 20
  rgm_obs_vol_period: 14
  rgm_obs_vol_lookback: 252
  rgm_realized_vol_period: 20

  # Event-sequence family thresholds (A5). Windows live in the feature
  # names; `<name>_<timeframe>` overrides the global default per timeframe.
  impulse_min_efficiency: 0.6
  volspike_min_ratio: 2.0
  volspike_min_body_frac: 0.6
  squeeze_max_pctile: 20.0
  hh_thrust_min_pctile: 80.0
  micro_burst_min_atr: 1.0
  imbalance_min: 0.5
  volshift_min: 0.25
  retest_atr_frac: 0.25
  spike_min_ratio: 2.0
  spike_min_ratio_daily: 1.5
  wick_min_frac: 0.6
  jump_min_atr: 3.0
  jump_min_atr_4hours: 2.5
  jump_min_atr_daily: 1.5
  compression_spread_min_z: 1.0
  news_cluster_min: 2
  # Calendar direction family (A6): event-window gate width, calendar days.
  cb_window_days: 3
  # Session-anchor family (A7): turn-of-month window (weekdays each side of
  # the month boundary), min_periods fraction of seasonal trailing windows.
  tom_window_days: 2
  seasonal_min_frac: 0.3333333333
  # Realized-moments family (A8): min_periods fraction of each moment window
  # (valid gap-masked returns), tail threshold for jump_asym in trailing sigmas.
  rm_min_frac: 0.75
  rm_jump_z: 2.0
  # Volume-spread family (A9): min_periods fraction of rolling windows,
  # min same-slot occurrences fraction of the seasonal baselines, jump gate in
  # trailing sigmas, vz averaging window at a Donchian break.
  vs_min_frac: 0.75
  vs_slot_min_frac: 0.4
  vs_jump_z: 2.0
  vs_break_ma: 4
  # Cross-pair family (A10): min_periods fraction of RV/cov/corr windows.
  xp_min_frac: 0.75
  # Timing/execution family (B6): windows in M15 bars / slot occurrences
  # (keys deliberately avoid the warm-up regex suffixes - see the module),
  # execution clips are risk limits, cost constants from utils/costs.py.
  tx_vol_fast: 16
  tx_vol_slow: 96
  tx_shift_span: 480
  tx_pct_span: 1920
  tx_break_span: 96
  tx_slot_days: 60
  tx_min_frac: 0.75
  tx_slot_min_frac: 0.4
  tx_sl_range_mult: 0.5
  tx_sl_min_pips: 15.0
  tx_sl_max_pips: 60.0
  tx_tp_range_mult: 0.5
  tx_tp_min_pips: 15.0
  tx_tp_max_pips: 150.0
  tx_trail_range_mult: 0.5
  tx_trail_min_pips: 8.0
  tx_trail_max_pips: 40.0
  tx_slippage_pips: 0.2
  tx_commission_per_million: 18.0
  tx_fallback_spread_pips: 0.4
  mtf_breakout_h4_bias_sources: [m15_breakout_close_5_20, 4hours_trend_slope_30]
  mtf_daily_squeeze_h4_expand_sources: [4hours_breakout_close_3_10, daily_range_pctile_10_20]
  mtf_daily_volshift_h4_bias_sources: [daily_atr_ratio_5_20, 4hours_trend_slope_30]
  mtf_squeeze_max_pctile: 20.0
